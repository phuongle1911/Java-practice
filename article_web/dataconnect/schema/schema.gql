
type Article @table (name: "articles", key:"id") {
  id: Int!
  categoryId: Int
  title: String!
  summary: String
  content: String
}

type Category @table (name: "categories", key:"id") {
  id: Int!
  name: String!
  parentId: Int
}

type User @table (name: "users", key:"id") {
  username: String!
  id: Int!
  password: String!
}