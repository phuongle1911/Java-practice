plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'war'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // jarkarta
    implementation 'jakarta.platform:jakarta.jakartaee-api:9.1.0'

    // Cloud SQL (PostgreSQL)
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.google.cloud.sql:postgres-socket-factory:1.21.0'

    // JSTL for the JSP view
    implementation('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0') {
        exclude group: 'jakarta.servlet'
        exclude group: 'jakarta.el'
    }
    implementation('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1') {
        exclude group: 'jakarta.servlet'
        exclude group: 'jakarta.el'
    }

    // password hash
    implementation 'com.password4j:password4j:1.8.4'

        // JJWT API
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    
    // JJWT Implementation (Runtime only)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    
    // JJWT JSON Processor (e.g., Jackson, Gson, or OrgJson)
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7' 
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'article_web.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
